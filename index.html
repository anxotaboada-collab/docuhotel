<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docuhotel — Gestor de documentos del hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#111"/>
      <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="32" y="28" width="36" height="44" rx="3"/>
        <line x1="40" y1="40" x2="60" y2="40"/>
        <line x1="40" y1="48" x2="60" y2="48"/>
        <line x1="40" y1="56" x2="52" y2="56"/>
      </g>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- pdf.js (~300 KB) is loaded lazily — only when the document viewer opens. -->
  <script>
    window.ensurePdfJs = function () {
      if (window.__pdfjsPromise) return window.__pdfjsPromise;
      window.__pdfjsPromise = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
        s.onload = function () {
          if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          }
          resolve(window.pdfjsLib || null);
        };
        s.onerror = function () { reject(new Error("pdf.js failed to load")); };
        document.head.appendChild(s);
      });
      return window.__pdfjsPromise;
    };
  </script>

  <!-- Runtime config: create config.js from config.example.js with your Supabase keys. -->
  <script src="config.js"></script>

  <!-- App code: prebuilt bundle of the .jsx source files (see build.mjs / `npm run build`). -->
  <script src="docuhotel.bundle.js?v=10f1401db7"></script>
</body>
</html>
