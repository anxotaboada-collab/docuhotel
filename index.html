<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docuhotel — Gestor de documentos del hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#111"/>
      <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="32" y="28" width="36" height="44" rx="3"/>
        <line x1="40" y1="40" x2="60" y2="40"/>
        <line x1="40" y1="48" x2="60" y2="48"/>
        <line x1="40" y1="56" x2="52" y2="56"/>
      </g>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!-- All vendor libs are served from the same origin (vendor/*) so that
       browsers with aggressive Tracking Prevention (Edge "Balanced"/"Strict")
       do not block storage access for third-party CDN domains, which manifests
       as supabase-js hanging on auth.getSession() for 60+ seconds. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/supabase.min.js"></script>
  <!-- pdf.js (~300 KB) is loaded lazily — only when the document viewer opens. -->
  <script>
    window.ensurePdfJs = function () {
      if (window.__pdfjsPromise) return window.__pdfjsPromise;
      window.__pdfjsPromise = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = "vendor/pdf.min.js";
        s.onload = function () {
          if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";
          }
          resolve(window.pdfjsLib || null);
        };
        s.onerror = function () { reject(new Error("pdf.js failed to load")); };
        document.head.appendChild(s);
      });
      return window.__pdfjsPromise;
    };
  </script>

  <!-- Runtime config: create config.js from config.example.js with your Supabase keys. -->
  <script src="config.js"></script>

  <!-- App code: prebuilt bundle of the .jsx source files (see build.mjs / `npm run build`). -->
  <script src="docuhotel.bundle.js?v=f05592872a"></script>

  <a id="back-to-hub" href="https://hub-anxotaboada-collabs-projects.vercel.app/" title="Volver al hub" style="position:fixed;bottom:14px;left:14px;z-index:9999;background:rgba(17,17,17,.82);color:#fff;text-decoration:none;font:13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:8px 12px;border-radius:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 12px rgba(0,0,0,.18)">← Hub</a>
</body>
</html>
